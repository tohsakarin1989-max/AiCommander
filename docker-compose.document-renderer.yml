# Optional override; use together with docker-compose.production.yml.
# Only the API image changes. Build the core image once via Celery so a clean
# build deployment also has the image shared by Celery/Beat/optional agents.
services:
  backend:
    image: ${IMAGE_PREFIX:-aicommander}-backend-documents:${APP_VERSION:-8.4.0-stable}
    build:
      context: ./backend
      target: document-renderer
    shm_size: 256m
    tmpfs:
      - /tmp:size=768m,mode=1777
  celery:
    build:
      context: ./backend
      target: runtime
