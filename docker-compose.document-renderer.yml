# Optional override; use together with docker-compose.production.yml.
# Only the API image changes. Celery/Beat keep the lightweight core image.
services:
  backend:
    image: ${IMAGE_PREFIX:-aicommander}-backend-documents:${APP_VERSION:-4.1.0-stable}
    build:
      context: ./backend
      target: document-renderer
    shm_size: 256m
    tmpfs:
      - /tmp:size=768m,mode=1777
