services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: aicommander
      POSTGRES_USER: aicommander
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aicommander-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicommander"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - map_packages:/var/lib/aicommander/maps
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql://aicommander:${DB_PASSWORD:-aicommander-dev-only}@postgres:5432/aicommander
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-development-secret-key-not-for-production}
      - BOOTSTRAP_TOKEN=${BOOTSTRAP_TOKEN:-dev-bootstrap-token-change-me}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-true}
      - SESSION_COOKIE_SECURE=false
      - ENABLE_API_DOCS=true
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,frontend
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FRONTEND_URL=http://localhost:3000
      - MAP_PACKAGE_ROOT=/var/lib/aicommander/maps
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://aicommander:${DB_PASSWORD:-aicommander-dev-only}@postgres:5432/aicommander
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-development-secret-key-not-for-production}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-true}
      - SESSION_COOKIE_SECURE=false
    depends_on:
      - postgres
      - redis
      - backend
    restart: unless-stopped

  celery-beat:
    build: ./backend
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://aicommander:${DB_PASSWORD:-aicommander-dev-only}@postgres:5432/aicommander
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-development-secret-key-not-for-production}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-true}
      - SESSION_COOKIE_SECURE=false
    depends_on:
      - postgres
      - redis
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  map_packages:
