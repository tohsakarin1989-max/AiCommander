name: Release quality gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: release-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install map style validator for backend integration tests
        working-directory: frontend
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest
      - name: Audit backend production dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.txt

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --audit=false
      - name: Audit cached frontend production dependencies
        working-directory: frontend
        run: npm audit --offline --omit=dev --audit-level=high
      - name: Refresh frontend advisory audit
        continue-on-error: true
        timeout-minutes: 2
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
        env:
          NPM_CONFIG_FETCH_RETRIES: "1"
          NPM_CONFIG_FETCH_TIMEOUT: "60000"
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --run
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  deployment-static:
    name: Deployment configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check patch formatting
        run: git diff --check
      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
      - name: Validate deployment scripts
        run: |
          sh -n scripts/preflight-production.sh
          sh -n scripts/backup-production.sh
          sh -n scripts/deploy-production.sh
          sh -n scripts/verify-test-deployment.sh
          sh -n scripts/verify-backup-restore.sh
          sh -n scripts/verify-v36-postgis.sh
          sh -n scripts/verify-v36-offline-map.sh
          sh -n scripts/verify-v36-competition-demo.sh
          sh -n scripts/rehearse-release.sh
          sh -n scripts/verify-agent-lab.sh
          sh -n scripts/verify-workbench.sh
          sh -n scripts/verify-evidence-graph.sh
          sh -n scripts/verify-situation.sh
